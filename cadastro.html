<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Livro</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>Cadastrar Livro</h1>
    <a href="index.php" class="btn-novo">← Voltar</a>
  </header>

  <form action="processadados.php" method="POST" style="padding: 30px; max-width: 400px;">
    <label>Título</label><br>
    <input type="text" name="titulo" required style="width:100%; margin-bottom:15px; padding:8px;"><br>

    <label>Autor</label><br>
    <input type="text" name="autor" required style="width:100%; margin-bottom:15px; padding:8px;"><br>

    <label>Preço</label><br>
    <input type="number" name="preco" step="0.01" required style="width:100%; margin-bottom:15px; padding:8px;"><br>

    <label>Categoria</label><br>
    <input type="text" name="categoria" style="width:100%; margin-bottom:15px; padding:8px;"><br>

    <button type="submit" class="btn-novo">Enviar</button>
  </form>
</body>
</html>
